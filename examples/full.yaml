# A full example: a new-grad software search across every built-in board, with filters and thresholds.
# A fuller example than jobhunter.example.yaml; every option is described in docs/settings.md.
# Secrets (webhooks, passwords, API keys) go in .env; this file only names the environment variables.

resumes:
  folder: resumes/                      # relative to this file
  default: backend.txt                  # .txt, .md, .pdf or .docx
  versions:                             # optional: used when a job mentions more of these words
    fullstack.txt:
      keywords: [react, reactjs, next.js, nextjs, frontend, front end, full stack, fullstack,
                 typescript, node, node.js, nodejs]
  # names: [John Doe]                   # optional; otherwise read from the default resume's first line

search:
  queries: [software engineer generalist, SDE new grad, full stack engineer, backend engineer,
            platform engineer, data engineer, AI engineer]
  locations: [United States, "Austin, TX", "Chicago, IL", "New York, NY", Remote]
  max_age_hours: 72                     # skip postings older than this (72 = 3 days); the default
  fetch_descriptions: true              # fetch the posting page when a board gives no description (LinkedIn, Hyde Park)

boards:                                 # built-in boards, or the name of a file in plugins/
  dice:                                 # newest Dice postings for each search query
    jobs_per_page: 100                  # 1-100
    max_pages: 3                        # so up to 300 postings per query
  linkedin: {timeout_s: 1200}           # needs Node.js (npx); one search per query and location, 5s apart
  industry_jobs:                        # dev.to posts with any of these tags (dev.to/t/<tag>)
    tags: [jobs, hiring]
  top_companies:                        # chosen employers' own career sites
    amazon: true                        # amazon.jobs; false to leave it out
    amazon_queries: 4                   # searched with your first 4 search queries
    greenhouse:                         # Greenhouse companies as <id>: <name>; the id is in boards.greenhouse.io/<id>
      sofi: SoFi                        # listing companies here replaces these two defaults
      stripe: Stripe
  hydepark:                             # jobs at Hyde Park Venture Partners portfolio companies
    job_functions: [Software Engineering]
  # ATS boards: `discover: true` reads postings found by discovery (below); `companies` lists whole boards,
  # e.g. greenhouse: {companies: [stripe, airbnb], discover: true}. Workday only discovers.
  greenhouse: {discover: true, timeout_s: 1800}
  lever: {discover: true}
  ashby: {discover: true}
  workday: {discover: true, timeout_s: 1800}
  dover: {job_board: true, discover: true}          # Dover's public job feed, plus discovered links
  adp:                                              # ADP Workforce Now: the cid= in a posting link
    companies: {a5625759-3bfa-45e5-889d-6b071698195a: JRAD}
    discover: true
  gem: {companies: [nominal], discover: true}       # Gem boards: jobs.gem.com/<name>
  vc_boards: {}                                     # discovery.getro / consider jobs no ATS board above reads

discovery:                              # links to ATS postings, fetched once per run
  github_readmes:                       # public job lists (free)
    - https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/README.md
    - https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/README.md
    - https://raw.githubusercontent.com/pittcsc/Summer2025-Internships/dev/README.md
  # google: {api_key_env: GOOGLE_API_KEY, cx_env: GOOGLE_CX}   # optional: Google Custom Search, 100 free queries a day
  # getro:                              # VC portfolio job boards on Getro: collection id: name
  #   collections: {189: Redpoint, 222: General Catalyst, 8672: Accel, 246: Insight Partners, 45303: FirstMark,
  #                 120: Lerer Hippeau, 1005: 8VC, 767: Menlo, 25: Foundry, 1124: Primary, 616: Greycroft, 103: Lux,
  #                 184: Upfront, 2105: Thrive}       # Hyde Park (112) is the hydepark board above
  #   locations: [United States]
  # consider: {boards: {jobs.a16z.com: a16z}}   # VC boards on Consider; roles default to [software-engineer]

filters:                                # run before any model, in this order
  location:
    countries: [US]                     # keep jobs in these countries; also CA, GB, IN, DE built in
  seniority:
    levels: [intern, entry, mid, senior]   # intern | entry | mid | senior | staff
    max_years_required: 3               # skip jobs asking for more years of experience than this
  keywords:                             # whole words and phrases, case-insensitive
    exclude_title: [principal, lead, staff, manager, director, vp, head, embedded, hardware, firmware,
                    scientist, ml engineer]
    exclude_phrases: [security clearance, ts/sci, top secret, polygraph, background investigation,
                      us person required]
    exclude_companies: [lensa, beaconfire, dataannotation, speechify, revature, bairesdev, turing,
                        crossover, epictura, fdny, outlier, capital placement]
    exclude_roles:                      # skip when at least min_matches different terms appear
      embedded: {terms: [c++, rtos, firmware, microcontroller, fpga, verilog, bare metal], min_matches: 2}
  # Optional: no board reports employment type, so this reads the title and description for contract or hourly-pay
  # wording ("contractor", "$55/hr", "6-month contract", "employment type: contract").
  employment:
    exclude: [contract, hourly]         # either or both; required
    contract_to_hire: exclude           # keep | exclude (default keep); "contract to hire", "cth", "temp to perm"
    hourly_internships: keep            # keep | exclude (default keep); interns are usually paid hourly
  # Optional: a local decision model (Ollama 0.35+, `ollama pull nimble:9b-q4_K_M`) for the questions rules cannot
  # answer. skip_if reads eligibility lines, so "U.S. citizen" in equal-opportunity text does not skip a job.
  systemone:
    model: "nimble:9b-q4_K_M"
    timeout_s: 30                       # seconds per question
    skip_if: [citizenship]              # citizenship and/or clearance

scorers:                                # tried in order; errors and rate limits fall through to the next
  - laya: {model: convaiinnovations/laya}    # downloaded on the first run; or the folder of a Laya you fine-tuned
  - ollama: {model: "gemma4:e4b", think: false, temperature: 0}   # any local model that fits your computer (README:
                                        # Ollama); run `ollama pull <model>` first. num_ctx is optional
  # Optional cloud fallbacks (free tiers; keys in .env, comma-separated to rotate on rate limits):
  # - gemini: {model: gemini-3.5-flash-lite, api_keys_env: GEMINI_API_KEYS}
  # - groq: {model: openai/gpt-oss-120b, api_keys_env: GROQ_API_KEYS}

cover_letters:                          # a draft letter in each notification, written by a text model
  enabled: false
  writer: ollama                        # ollama, gemini or groq (must be listed under scorers)
  # options: {model: "gemma4:e4b"}      # for letters only: a larger model than scoring needs (README: Ollama);
                                        # ollama letters default to think: true, temperature: 0.7

decisions:
  notify_at: 7                          # score >= 7 -> notify
  log_at: 5                             # score 5-6 -> log; below 5 -> skip
  min_confidence: 0.7                   # Laya also says how sure it is, from 0 to 1. A job it scores notify_at or
                                        # higher, but is less than 0.7 sure of, is logged instead of sent. Leave
                                        # it out to send every job that reaches notify_at

schedule:                               # used by scheduler.py and `run --scheduled`; a plain `run` ignores it
  every: 1h                             # time between runs: 15m to 24h
  quiet_hours: "22:00-07:00"            # no runs in this window (may cross midnight)
  quiet_days: [sat, sun]                # no runs on these days
  timezone: America/New_York            # for quiet hours and days; default: the computer's

