#   slack: {webhook_env: SLACK_WEBHOOK_URL}
#   email: {from_env: GMAIL_ADDRESS, password_env: GMAIL_APP_PASSWORD,  # to_env: NOTIFY_EMAIL (optional)
#           alert_tag: jobhunter, feedback_tag: jobhunter-feedback}      # plus tags for alerts and feedback buttons
