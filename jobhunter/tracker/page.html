<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications · jobhunter</title>
<style>
:root {
  --paper: #f7f5f0; --ink: #1c1b19; --muted: #6b675f; --rule: #e3dfd6; --raised: #fffdf8;
  --accent: #1f6f50; --accent-soft: #e4efe9; --focus: #1f6f50;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #161513; --ink: #ece8df; --muted: #a29d92; --rule: #2e2b27; --raised: #1f1d1a;
          --accent: #5fbf94; --accent-soft: #1f3329; --focus: #5fbf94; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); }
.num, kbd, time, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
header { position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--rule); padding: 12px 20px; z-index: 2; }
.bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 600; letter-spacing: .02em; margin-right: 8px; background: none; border: 0; padding: 0; cursor: pointer; }
.add { flex: 1 1 420px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#quick { flex: 1 1 auto; min-width: 0; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--raised); }
.primary { background: var(--accent); color: var(--paper); border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
#search { flex: 1 1 200px; padding: 6px 10px; border: 1px solid var(--accent); border-radius: 6px; background: var(--raised); }
.link { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; text-decoration: underline dotted; }
.link.on, .link:hover { color: var(--ink); }
.pipeline { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 13px; }
.pipeline button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
.pipeline button.on { color: var(--ink); text-decoration: underline; }
.tabs { display: flex; gap: 6px; margin: 14px 0 4px; }
.tabs button { border: 1px solid var(--rule); background: var(--raised); border-radius: 6px; padding: 4px 12px; cursor: pointer; color: var(--muted); }
.tabs button.on { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.pipeline[hidden], .strip[hidden] { display: none; }
.strip { display: flex; height: 6px; margin-top: 6px; border-radius: 3px; overflow: hidden; background: var(--rule); }
.strip span { background: var(--accent); opacity: .85; }
.strip span + span { border-left: 2px solid var(--paper); }
main { padding: 8px 20px 80px; }
body.drawer-open main { margin-right: 380px; }
h2 { font-size: 11px; font-variant: small-caps; text-transform: lowercase; letter-spacing: .08em; color: var(--muted);
     margin: 22px 0 4px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
h2 .count { font-family: var(--mono); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 8px 4px; }
td { height: 32px; padding: 0 8px; border-top: 1px solid var(--rule); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--raised); }
tr.row.focus td { background: var(--accent-soft); }
tr.closed td { color: var(--muted); }
.dot { width: 110px; } .company { width: 22%; } .stage { width: 90px; } .age { width: 96px; text-align: right; }
.fit { width: 70px; } .when { width: 120px; text-align: right; } .due { width: 90px; text-align: right; } .kind { width: 90px; color: var(--muted); } .board { width: 110px; color: var(--muted); } .acts { width: 230px; }
.acts-row { display: flex; gap: 8px; justify-content: flex-end; }
a.title-link { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
a.title-link:hover { color: var(--accent); border-bottom-color: var(--accent); }
.danger { margin-top: 18px; border: 1px solid var(--rule); background: none; color: var(--muted); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
.danger.armed { border-color: #b4442f; color: #b4442f; }
.mark { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); margin-right: 6px; vertical-align: middle; }
.mark.on { background: var(--accent); border-color: var(--accent); }
.reason { font-size: 12px; }
.acts button, .stages button, .small { border: 1px solid var(--rule); background: var(--raised); border-radius: 5px; padding: 2px 8px; cursor: pointer; }
kbd { font-size: 11px; color: var(--muted); }
.empty { color: var(--muted); padding: 10px 8px; }
.few { color: var(--muted); }
.bar-cell { display: inline-block; height: 6px; background: var(--accent); border-radius: 3px; vertical-align: middle; margin-left: 6px; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: var(--raised); border-left: 1px solid var(--rule);
          box-shadow: -8px 0 24px rgba(0,0,0,.06); padding: 18px 20px; overflow-y: auto; z-index: 3; transition: transform .15s ease-out; }
#drawer[hidden] { display: block; transform: translateX(100%); visibility: hidden; }
#drawer .close { position: absolute; top: 10px; right: 12px; background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--muted); }
.eyebrow { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
.edit { display: block; width: 100%; border: 1px solid transparent; background: transparent; padding: 2px 4px; margin: 0 -4px; border-radius: 4px; }
.edit:hover, .edit:focus { border-color: var(--rule); background: var(--paper); }
.edit.big { font-size: 18px; font-weight: 600; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
.stages button.on { border-color: var(--accent); color: var(--accent); }
.stages .on-date { color: var(--muted); font-size: 12px; } .stages .on-date input { border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); padding: 1px 4px; }
label.field { display: block; margin-top: 12px; color: var(--muted); font-size: 12px; }
label.field input, label.field textarea { display: block; width: 100%; margin-top: 4px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); color: var(--ink); }
textarea { min-height: 90px; resize: vertical; }
textarea.letter { min-height: 260px; font-size: 13px; line-height: 1.5; }
.cl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 0; }
.hint { color: var(--muted); font-size: 12px; }
.stages .hint { align-self: center; }
.primary[disabled] { opacity: .6; cursor: default; }
label.field .saved { float: right; color: var(--muted); }
.timeline { list-style: none; padding: 0; margin: 16px 0 0; border-top: 1px solid var(--rule); }
.timeline li { padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.timeline time { color: var(--muted); margin-right: 10px; }
pre.jd { white-space: pre-wrap; font: 13px/1.5 var(--sans); background: var(--paper); padding: 10px; border-radius: 5px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper);
         padding: 8px 14px; border-radius: 6px; display: flex; gap: 12px; align-items: center; transition: opacity .15s; z-index: 4; }
#toast[hidden] { display: flex; opacity: 0; pointer-events: none; }
#toast button { background: none; border: 0; color: var(--paper); text-decoration: underline; cursor: pointer; }
#help { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; z-index: 5; }
#help[hidden] { display: none; }
#help .card { background: var(--raised); padding: 20px 24px; border-radius: 8px; max-width: 420px; }
#help dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; }
.notice { max-width: 560px; margin: 80px auto; color: var(--muted); }
@media (max-width: 900px) {
  body.drawer-open main { margin-right: 0; }
  #drawer { width: 100%; }
  .board, .fit { display: none; }
}
@media (prefers-reduced-motion: reduce) { #drawer, #toast { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="brand" id="brand" type="button" title="All applications">jobhunter · applications</button>
    <div class="add">
      <label for="quick" class="sr-only">Add application</label>
      <input id="quick" type="text" autocomplete="off" placeholder="New application: paste a job link, or type Company — Title">
      <button type="button" class="primary" id="add-button">Add</button>
    </div>
    <input id="search" type="search" aria-label="Search applications" placeholder="Search company, title, notes" hidden>
    <button class="link" id="search-open" type="button" title="Search (⌘K)">search</button>
    <button class="link" id="view-alerts" type="button">alerts <span class="num" id="alerts-count"></span></button>
    <button class="link" id="view-numbers" type="button">numbers</button>
    <a class="link" id="export" download="applications.csv">export</a>
    <button class="link" id="help-open" type="button" aria-label="Keyboard shortcuts">?</button>
  </div>
  <div class="pipeline" id="pipeline"></div>
  <div class="strip" id="strip" aria-hidden="true"></div>
</header>
<main id="main"></main>
<aside id="drawer" hidden aria-label="Application details"></aside>
<div id="toast" hidden role="status"></div>
<div id="help" hidden role="dialog" aria-label="Keyboard shortcuts">
  <div class="card">
    <dl>
      <dt><kbd>j</kbd> <kbd>k</kbd></dt><dd>move down and up</dd>
      <dt><kbd>Enter</kbd> <kbd>Esc</kbd></dt><dd>open and close details</dd>
      <dt><kbd>s</kbd> <kbd>i</kbd> <kbd>o</kbd></dt><dd>screen, interview, offer</dd>
      <dt><kbd>r</kbd> <kbd>w</kbd> <kbd>g</kbd></dt><dd>rejected, withdrawn, ghosted</dd>
      <dt><kbd>n</kbd> <kbd>f</kbd> <kbd>d</kbd></dt><dd>notes, set follow-up, follow-up done</dd>
      <dt><kbd>a</kbd> <kbd>b</kbd> <kbd>x</kbd></dt><dd>alerts: applied, bad match, hide</dd>
      <dt><kbd>v</kbd></dt><dd>applications, alerts, numbers</dd>
      <dt><kbd>⌘K</kbd> / <kbd>Ctrl K</kbd></dt><dd>search</dd>
    </dl>
  </div>
</div>
<script>
"use strict";
const TOKEN = (() => {
  const given = new URLSearchParams(location.search).get("t");
  try {
    if (given) sessionStorage.setItem("jh-token", given);
    if (given) history.replaceState(null, "", "/");
    return given || sessionStorage.getItem("jh-token");
  } catch (e) { return given; }
})();
const STAGE_KEYS = {s: "screen", i: "interview", o: "offer", r: "rejected", w: "withdrawn", g: "ghosted"};
const KEY_OF = Object.fromEntries(Object.entries(STAGE_KEYS).map(([k, s]) => [s, k]));
const VIEWS = ["apps", "alerts", "numbers"];      // "apps" has no header link: the brand and the stage row open it
let openAlertId = null;        // the alert (job id) whose panel is open, when no application's is
let state = null, view = "apps", cursor = 0, openId = null, stageFilter = null, query = "", showClosed = false;
let alertsTab = "review";      // alerts page: "review" or "dismissed"
let visible = [];          // rows j/k move through: {type: "app", id} or {type: "review", job_id}
let toastTimer = null;

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key === "on") for (const [event, fn] of Object.entries(value)) node.addEventListener(event, fn);
    else if (key === "value") node.value = value;
    else if (value !== undefined && value !== null && value !== false) node.setAttribute(key, value === true ? "" : value);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
// A date input saves on blur, and only a whole date from 2000 on: while typing, a field passes through years like 0002.
function validDate(v) { return /^\d{4}-\d{2}-\d{2}$/.test(v || "") && Number(v.slice(0, 4)) >= 2000; }
function safeHref(url) { return /^https?:\/\//i.test(url || "") ? url : null; }
function kids(...nodes) { return nodes.flat().filter(n => n !== null && n !== undefined && n !== false); }

async function api(method, path, body) {
  const resp = await fetch(path, {method, headers: {"X-Tracker-Token": TOKEN || "", "Content-Type": "application/json"},
                                  body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
  return data;
}
async function refresh() {
  try { state = await api("GET", "/api/state"); }
  catch (e) { showNotice(`Could not load the tracker (${e.message}). Open the address the jobhunter tracker command printed.`); return; }
  render();
}
function showNotice(text) { document.getElementById("main").replaceChildren(el("p", {class: "notice"}, text)); }

function daysBetween(fromIso, toIso) { return Math.round((Date.parse(toIso.slice(0, 10)) - Date.parse(fromIso.slice(0, 10))) / 86400000); }
// A time for today ("2:15 PM"), the weekday and time within the week ("Mon 2:15 PM"), else the date ("Oct 3").
function when(iso) {
  const t = new Date(iso), now = new Date();
  if (isNaN(t)) return "";
  const time = t.toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"});
  if (t.toDateString() === now.toDateString()) return time;
  if (now - t < 6 * 86400000) return `${t.toLocaleDateString(undefined, {weekday: "short"})} ${time}`;
  return t.toLocaleDateString(undefined, {month: "short", day: "numeric"});
}
function localDay(iso) {
  const t = new Date(iso);
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
}
function whenFull(iso) { const t = new Date(iso); return isNaN(t) ? "" : t.toLocaleString(); }
// An application's age: days since its last activity, or, for activity today, the time it was entered.
// When an application last changed, for the "last activity" column: the latest event dated today or earlier (a call
// scheduled ahead is not activity yet). Its entry time comes along when it was entered on that same day, for the
// tooltip; a back-dated event has a date only.
function lastActivityAt(a) {
  const events = a.events.filter(e => e.at <= state.today).sort((x, y) => (x.at + (x.created_at || "")).localeCompare(y.at + (y.created_at || "")));
  const e = events[events.length - 1];
  if (!e) return a.created_at || "";
  return e.created_at && localDay(e.created_at) === e.at ? e.created_at : e.at;
}
// The "last activity" date in every row ("Oct 20"), with the year when it is not this year: one format for the
// column. The exact time is in the cell's tooltip; a back-dated event has a date only.
function dayOf(iso) {
  const t = /T/.test(iso) ? new Date(iso) : new Date(iso + "T12:00:00");
  if (isNaN(t)) return "";
  const opts = {month: "short", day: "numeric"};
  if (t.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return t.toLocaleDateString(undefined, opts);
}
function until(iso) {
  const d = daysBetween(state.today, iso);
  return d < 0 ? `${-d}d late` : d === 0 ? "today" : d === 1 ? "tmrw" : `in ${d}d`;
}
function fmt(iso) { return new Date(iso.slice(0, 10) + "T12:00:00").toLocaleDateString(undefined, {month: "short", day: "numeric", year: "numeric"}); }
function allApps() { return state ? [...state.groups.needs, ...state.groups.waiting, ...state.groups.closed] : []; }
function findApp(id) { return allApps().find(a => a.id === id) || null; }
function matches(a) {
  if (stageFilter && a.stage !== stageFilter) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return [a.company, a.title, a.notes, a.people].some(v => (v || "").toLowerCase().includes(q));
}
function matchesReview(r) {
  return !query || [r.company, r.title].some(v => (v || "").toLowerCase().includes(query.toLowerCase()));
}

function render() {
  if (!state) return;
  renderPipeline();
  for (const v of ["alerts", "numbers"]) document.getElementById(`view-${v}`).classList.toggle("on", view === v);
  document.getElementById("alerts-count").textContent = state.review.length || "";
  document.getElementById("export").setAttribute("href", `/api/export.csv?t=${encodeURIComponent(TOKEN || "")}`);
  const main = document.getElementById("main");
  main.replaceChildren(...(view === "numbers" ? renderNumbers() : view === "alerts" ? renderAlerts() : renderApps()));
  markCursor();
  renderDrawer();
}
function renderPipeline() {
  const open = state.open_stages, closed = state.closed_stages, counts = state.counts;
  const total = open.reduce((sum, s) => sum + counts[s], 0);
  // The way to the applications page (there is no separate link): a stage shows its applications, clicking it
  // again on that page shows them all.
  const button = s => el("button", {type: "button", class: view === "apps" && stageFilter === s ? "on" : "",
    on: {click: () => { stageFilter = stageFilter === s && view === "apps" ? null : s; view = "apps"; render(); }}},
    `${s} `, el("span", {class: "num"}, counts[s]));
  const pipeline = document.getElementById("pipeline");
  pipeline.replaceChildren(
    ...open.flatMap((s, i) => i < open.length - 1 ? [button(s), el("span", {"aria-hidden": "true"}, "▸")] : [button(s)]),
    el("span", {style: "margin-left:auto"}), ...closed.map(button));
  document.getElementById("strip").replaceChildren(
    ...open.filter(s => counts[s]).map(s => el("span", {style: `flex:${counts[s]}`, title: `${s} ${counts[s]}`})));
  if (!total) document.getElementById("strip").replaceChildren();
}
function header(...cols) { return el("thead", {}, el("tr", {}, cols.map(([label, cls]) => el("th", {class: cls, scope: "col"}, label)))); }
// No fit: the job was judged by a decision-only checkpoint (alert, save or skip), or never scored.
// A scaled fit shows raw in a tooltip, so the 0-10 calibration never hides where the score actually came from.
function fitCell(row) {
  if (!row.fit) return el("span", {title: "id" in row && !row.job_id ? "added by hand: no fit score"
                                                    : "no fit score (decided without one, or not scored)"}, "—");
  return row.fit_raw && row.fit_raw !== row.fit ? el("span", {title: "raw " + row.fit_raw}, row.fit) : row.fit;
}
function titleCell(title, url) {
  const href = safeHref(url);
  if (!href) return title || "—";
  return el("a", {href: safeHref(url), class: "title-link", target: "_blank", rel: "noopener noreferrer",
                  title: "Open the posting", on: {click: e => e.stopPropagation()}}, title || "—");
}
function appRow(a) {
  const last = lastActivityAt(a);
  return el("tr", {class: `row${state.closed_stages.includes(a.stage) ? " closed" : ""}`, "data-key": `app:${a.id}`,
                   on: {click: () => { cursor = visible.findIndex(v => v.type === "app" && v.id === a.id); openDrawer(a.id); }}},
    el("td", {class: "dot"}, el("span", {class: a.reason ? "mark on" : "mark", "aria-hidden": "true"}),
       el("span", {class: "reason"}, a.reason || "")),
    el("td", {class: "company"}, a.company || "—"),
    el("td", {class: "title", title: a.title}, titleCell(a.title, a.url)),
    el("td", {class: "stage"}, a.stage),
    el("td", {class: "due num"}, a.due ? until(a.due) : ""),
    el("td", {class: "when num", title: /T/.test(last) ? whenFull(last) : fmt(last)}, dayOf(last)),
    el("td", {class: "fit num"}, fitCell(a)),
    el("td", {class: "board"}, a.board || ""));
}
function reviewRow(r) {
  const act = (label, key, action) => el("button", {type: "button", title: `${label} (${key})`,
                                                     on: {click: e => { e.stopPropagation(); review(r.job_id, action); }}}, label);
  return el("tr", {class: "row", "data-key": `review:${r.job_id}`,
                   on: {click: () => { cursor = visible.findIndex(v => v.type === "review" && v.job_id === r.job_id); openAlert(r.job_id); }}},
    el("td", {class: "company"}, r.company || "—"),
    el("td", {class: "title", title: r.title}, titleCell(r.title, r.url)),
    el("td", {class: "when num", title: whenFull(r.alerted_at)}, when(r.alerted_at)),
    el("td", {class: "fit num"}, fitCell(r)),
    el("td", {class: "acts"}, el("div", {class: "acts-row"},
       act("applied", "a", "applied"), act("bad match", "b", "bad"), act("hide", "x", "hide"))));
}
function group(title, apps, opts = {}) {
  const head = el("h2", {}, title, " · ", el("span", {class: "count"}, apps.length), opts.toggle || null);
  if (opts.collapsed) return [head];
  if (!apps.length) return opts.empty ? [head, el("p", {class: "empty"}, opts.empty)] : [];
  return [head, el("table", {}, header(["", "dot"], ["company", "company"], ["title", "title"], ["stage", "stage"],
                                       ["due", "due"], ["last activity", "when"], ["fit", "fit"], ["board", "board"]),
                   el("tbody", {}, apps.map(appRow)))];
}
function renderApps() {
  const g = state.groups;
  const needs = g.needs.filter(matches), waiting = g.waiting.filter(matches), closed = g.closed.filter(matches);
  visible = [...needs, ...waiting, ...(showClosed ? closed : [])].map(a => ({type: "app", id: a.id}));
  const closedToggle = el("button", {type: "button", class: "link", on: {click: () => { showClosed = !showClosed; render(); }}},
                          showClosed ? "hide" : "show");
  const parts = [
    ...group("needs you", needs),
    ...group("waiting", waiting),
    ...(closed.length ? group("closed", closed, {collapsed: !showClosed, toggle: closedToggle}) : []),
  ];
  if (!allApps().length && !query) parts.push(el("p", {class: "empty"}, "No applications yet. Mark the alerts you applied to "
                                                 + "with “applied” on the alerts page, or add one with the Add box above."));
  if (query && !visible.length) parts.push(el("p", {class: "empty"}, `No matches for “${query}”.`));
  else if (stageFilter && !visible.length && allApps().length) parts.push(el("p", {class: "empty"},
    showClosed || !state.closed_stages.includes(stageFilter) ? `No applications in ${stageFilter}.`
                                                              : `No applications in ${stageFilter}. Closed ones are hidden: show them below.`));
  return parts;
}
function dismissedRow(r) {
  const restoreButton = el("button", {type: "button", title: "Put it back in the alerts to review",
                                      on: {click: e => { e.stopPropagation(); restore(r); }}}, "restore");
  return el("tr", {class: "row closed", "data-key": `dismissed:${r.job_id}`, on: {click: () => openAlert(r.job_id)}},
    el("td", {class: "company"}, r.company || "—"),
    el("td", {class: "title", title: r.title}, titleCell(r.title, r.url)),
    el("td", {class: "when num", title: whenFull(r.alerted_at)}, when(r.alerted_at)),
    el("td", {class: "fit num"}, fitCell(r)),
    el("td", {class: "kind", title: whenFull(r.at)}, r.kind === "bad" ? "bad match" : "hidden"),
    el("td", {class: "acts"}, el("div", {class: "acts-row"},
       r.kind === "hidden" || r.message_id ? restoreButton
         : el("span", {class: "reason", title: "Marked from an alert email; change it with that email's buttons"}, "from email"))));
}
// Two tabs at the top: the alerts to review, and the ones marked a bad match or hidden (restorable). Below 200
// review rows a second list would be missed.
function renderAlerts() {
  const review = state.review.filter(matchesReview), dismissed = state.dismissed.filter(matchesReview);
  const tab = (key, label, n) => el("button", {type: "button", class: alertsTab === key ? "on" : "",
    on: {click: () => { alertsTab = key; cursor = 0; render(); }}}, `${label} `, el("span", {class: "num"}, n));
  const parts = [el("div", {class: "tabs", id: "alerts-tabs", role: "tablist"},
                    tab("review", "to review", review.length), tab("dismissed", "bad match and hidden", dismissed.length))];
  if (alertsTab === "dismissed") {
    visible = [];
    parts.push(dismissed.length
      ? el("table", {}, header(["company", "company"], ["title", "title"], ["alerted", "when"], ["fit", "fit"],
                               ["marked", "kind"], ["", "acts"]),
           el("tbody", {}, dismissed.map(dismissedRow)))
      : el("p", {class: "empty"}, query ? `No bad matches or hidden alerts match “${query}”.`
                                        : "Alerts you mark a bad match or hide show up here, and can be restored."));
    return parts;
  }
  visible = review.map(r => ({type: "review", job_id: r.job_id}));
  parts.push(el("p", {class: "empty"}, query ? "Alerts matching your search." : `Alerts from the last ${state.settings.review_days} days.`));
  parts.push(review.length
    ? el("table", {}, header(["company", "company"], ["title", "title"], ["alerted", "when"], ["fit", "fit"], ["", "acts"]),
         el("tbody", {}, review.map(reviewRow)))
    : el("p", {class: "empty"}, query ? `No alerts match “${query}”.` : "No recent alerts to review."));
  return parts;
}
function renderNumbers() {
  const n = state.numbers;
  const pct = r => r.rate === null ? "—" : `${Math.round(r.rate * 100)}%`;
  const table = (title, rows) => [el("h2", {}, title), el("table", {}, header(["", "company"], ["replied", "age"], ["n", "age"], ["", "title"]),
    el("tbody", {}, rows.map(r => el("tr", {class: r.few ? "few" : ""},
      el("td", {}, r.label || "all"), el("td", {class: "age num"}, pct(r)), el("td", {class: "age num"}, r.n),
      el("td", {}, r.few ? "too few" : el("span", {class: "bar-cell", style: `width:${Math.round((r.rate || 0) * 160)}px`}))))))];
  return [
    ...table("reply rate (screen or further)", [n.overall]),
    ...table("by board", n.by_board), ...table("by resume", n.by_resume),
    ...table("by fit band", n.by_fit), ...table("by week applied", n.by_week),
    el("h2", {}, "median days to first reply"),
    el("p", {class: "num"}, n.median_days_to_reply === null ? "—" : `${n.median_days_to_reply} days, from ${n.replies_counted} replies`),
  ];
}

function findAlert(jobId) {
  return state.review.find(r => r.job_id === jobId) || state.dismissed.find(r => r.job_id === jobId) || null;
}
// An alert's panel: what it is, its link and stored description, and the same actions as its row.
function renderAlertDrawer(r) {
  const drawer = document.getElementById("drawer");
  document.body.classList.add("drawer-open");
  drawer.hidden = false;
  const dismissed = state.dismissed.some(d => d.job_id === r.job_id);
  const act = (label, action) => el("button", {type: "button", on: {click: () => review(r.job_id, action)}}, label);
  const actions = dismissed
    ? [el("span", {class: "hint"}, r.kind === "bad" ? "marked a bad match" : "hidden"),
       r.kind === "hidden" || r.message_id ? el("button", {type: "button", on: {click: () => restore(r)}}, "restore")
                                           : el("span", {class: "hint"}, "from email")]
    : [act("applied", "applied"), act("bad match", "bad"), act("hide", "hide")];
  const eyebrow = [r.board, r.fit && `fit ${r.fit}`, r.alerted_at && `alerted ${whenFull(r.alerted_at)}`].filter(Boolean);
  drawer.replaceChildren(...kids(
    el("button", {type: "button", class: "close", "aria-label": "Close", on: {click: closeDrawer}}, "×"),
    el("p", {class: "eyebrow"}, eyebrow.join(" · ")),
    el("p", {class: "edit big"}, r.company || "—"), el("p", {class: "edit"}, r.title || "—"),
    safeHref(r.url) ? el("p", {}, el("a", {href: safeHref(r.url), target: "_blank", rel: "noopener noreferrer"}, "Open the posting ↗")) : null,
    el("div", {class: "stages"}, actions),
    el("p", {}, el("button", {type: "button", class: "small", on: {click: e => showJobDescription(r.job_id, e.target)}},
                   "Show job description"))));
}
async function showJobDescription(jobId, button) {
  const {text} = await api("POST", "/api/job-description", {job_id: jobId});
  button.replaceWith(el("pre", {class: "jd"}, text || "No description was stored for this job."));
}
function renderDrawer() {
  const drawer = document.getElementById("drawer");
  if (openAlertId !== null && openId === null) {
    const r = findAlert(openAlertId);
    if (r) return renderAlertDrawer(r);
    openAlertId = null;                       // marked applied: it is an application now, not an alert
  }
  const a = openId === null ? null : findApp(openId);
  document.body.classList.toggle("drawer-open", !!a);
  drawer.hidden = !a;
  if (!a) { drawer.replaceChildren(); return; }
  const stages = state.stages.map(s => el("button", {type: "button", class: s === a.stage ? "on" : "",
    title: KEY_OF[s] ? `${s} (${KEY_OF[s]})` : s, on: {click: () => setStage(a.id, s)}}, s));
  const follow = el("input", {type: "date", id: "follow-up", value: a.follow_up_at || "",
    on: {blur: e => validDate(e.target.value) && e.target.value !== a.follow_up_at
                    && act(`/api/applications/${a.id}/follow-up`, {date: e.target.value}, "Follow-up set")}});
  // Same rule as fitCell: a scaled fit keeps the raw value in a tooltip, so the eyebrow never hides where it came from.
  const fitPart = a.fit && (a.fit_raw && a.fit_raw !== a.fit
    ? el("span", {title: "raw " + a.fit_raw}, `fit ${a.fit}`) : `fit ${a.fit}`);
  const eyebrow = [a.board, fitPart, a.resume_id && `resume: ${a.resume_id}`].filter(Boolean);
  drawer.replaceChildren(...kids(
    el("button", {type: "button", class: "close", "aria-label": "Close", on: {click: closeDrawer}}, "×"),
    el("p", {class: "eyebrow"}, eyebrow.flatMap((part, i) => i ? [" · ", part] : [part])),
    editable(a, "company", "edit big", "Company"), editable(a, "title", "edit", "Title"),
    safeHref(a.url) ? el("p", {}, el("a", {href: safeHref(a.url), target: "_blank", rel: "noopener noreferrer"}, "Open the posting ↗")) : null,
    el("div", {class: "stages"}, stages,
       el("label", {class: "on-date"}, "on ", el("input", {type: "date", id: "stage-on", "aria-label": "Stage date (empty: today)"}))),
    el("label", {class: "field"}, "Follow up on", follow),
    a.follow_up_at ? el("button", {type: "button", class: "small", on: {click: () => act(`/api/applications/${a.id}/follow-up`, {done: true}, "Follow-up done")}},
                        "follow-up done") : null,
    el("label", {class: "field"}, "Applied on", editable(a, "applied_at", "", "Applied on", "date")),
    el("label", {class: "field"}, "People", editable(a, "people", "", "Jane at Acme, recruiter")),
    el("label", {class: "field"}, "Notes", editable(a, "notes", "", "", "textarea")),
    coverLetter(a),
    el("ol", {class: "timeline", reversed: true}, [...a.events].reverse().map(e => el("li", {},
      el("time", {datetime: e.at}, fmt(e.at) + (e.created_at && localDay(e.created_at) === e.at
                                                ? `, ${new Date(e.created_at).toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"})}` : "")),
      e.kind === "stage" ? e.value : e.kind === "follow_up_set" ? `follow up on ${fmt(e.value)}` : "follow-up done"))),
    a.job_id ? el("p", {}, el("button", {type: "button", class: "small", on: {click: e => showDescription(a.id, e.target)}}, "Show job description")) : null,
    el("button", {type: "button", class: "danger", on: {click: e => deleteApplication(a.id, e.currentTarget)}}, "Delete application")));
}
// The cover letter: written from the stored job description and the resume by cover_letters.writer, and saved with the
// application. Writing takes a minute or two, so the button shows it is busy and the rest of the page keeps working.
const writingLetters = new Set();
function coverLetter(a) {
  const label = el("label", {class: "field"}, "Cover letter",
    a.cover_letter && a.cover_letter_at ? el("span", {class: "saved"}, `saved · ${dayOf(a.cover_letter_at)}`) : null,
    a.cover_letter ? editable(a, "cover_letter", "letter", "", "textarea") : null);
  if (writingLetters.has(a.id)) {
    return [label, el("p", {class: "cl-row"},
      el("button", {type: "button", class: "primary", disabled: true}, "Writing… (about a minute)"),
      el("span", {class: "hint"}, "you can keep using the tracker"))];
  }
  if (a.cover_letter) {
    return [label, el("p", {class: "cl-row"},
      el("button", {type: "button", class: "small", on: {click: () => copyLetter()}}, "Copy"),
      el("button", {type: "button", class: "small", on: {click: () => writeLetter(a.id)}}, "Write again"))];
  }
  const can = a.has_description;
  return [label, el("p", {class: "cl-row"},
    el("button", {type: "button", class: "primary", disabled: !can,
                  title: can ? null : "added by hand: no job description is stored to write from",
                  on: {click: () => writeLetter(a.id)}}, "Write cover letter"),
    el("span", {class: "hint"}, can ? "from the job description and your resume"
                                    : "needs a stored job description; applications from alerts have one"))];
}
async function writeLetter(id) {
  writingLetters.add(id); renderDrawer();
  try { await api("POST", `/api/applications/${id}/cover-letter`, {}); toast("Cover letter written"); }
  catch (e) { toast(`No letter: ${e.message}`); }
  finally { writingLetters.delete(id); await refresh(); }
}
async function copyLetter() {
  const box = document.getElementById("field-cover_letter");
  if (!box) return;
  try { await navigator.clipboard.writeText(box.value); toast("Copied"); }
  catch (e) { box.focus(); box.select(); toast("Selected: press ⌘C to copy"); }
}
function editable(a, field, cls, placeholder, kind = "text") {
  const props = {class: cls, id: `field-${field}`, value: a[field] || "", placeholder, "aria-label": placeholder || field,
    on: {[kind === "date" ? "blur" : "change"]: e => kind === "date" && (!validDate(e.target.value) || e.target.value === a[field])
                                                     ? null : save(a.id, field, e.target.value)}};
  return kind === "textarea" ? el("textarea", props) : el("input", {...props, type: kind});
}
// Deleting asks for a second click within 4 s instead of a dialog; it cannot be undone.
async function deleteApplication(id, button) {
  if (!button.classList.contains("armed")) {
    button.classList.add("armed"); button.textContent = "Click again to delete";
    setTimeout(() => { button.classList.remove("armed"); button.textContent = "Delete application"; }, 4000);
    return;
  }
  try { await api("POST", `/api/applications/${id}/delete`, {}); closeDrawer(); await refresh(); toast("Application deleted"); }
  catch (e) { toast(`Not deleted: ${e.message}`); }
}
async function save(id, field, value) {
  try { await api("POST", `/api/applications/${id}`, {[field]: value}); await refresh(); }
  catch (e) { toast(`Not saved: ${e.message}`); }
}
async function showDescription(id, button) {
  const {text} = await api("GET", `/api/applications/${id}/description`);
  button.replaceWith(el("pre", {class: "jd"}, text || "No description was stored for this job."));
}
// Opening from closed adds one history entry, so the browser's back button closes the drawer instead of leaving the
// tracker; Esc and × go back through that entry rather than adding another.
function openDrawer(id, draw = true) {
  if (openId === null && openAlertId === null) history.pushState({drawer: id}, "");
  openId = id; openAlertId = null;
  if (draw) render();
}
function openAlert(jobId) {
  if (openId === null && openAlertId === null) history.pushState({drawer: `alert:${jobId}`}, "");
  openAlertId = jobId; openId = null;
  render();
}
function closeDrawer() {
  if (history.state && history.state.drawer !== undefined) history.back();
  else { openId = null; openAlertId = null; render(); }
}

async function act(path, body, message) {
  try {
    const r = await api("POST", path, body); await refresh();
    if (r.event_ids && r.event_ids.length) toast(message, () => api("POST", "/api/events/delete", {ids: r.event_ids}));
  } catch (e) { toast(`Failed: ${e.message}`); }
}
function setStage(id, stage) {
  const on = document.getElementById("stage-on"), at = on && on.value;
  if (at && !validDate(at)) { toast("Pick a full date from 2000 on, or leave it empty for today"); return; }
  return act(`/api/applications/${id}/stage`, at ? {stage, at} : {stage}, `Moved to ${stage}`);
}
async function review(jobId, action) {
  // The cursor moves on to the next row of the queue, by its key: rows above it shift when `a` adds an application.
  const queue = visible.filter(v => v.type === "review"), at = queue.findIndex(v => v.job_id === jobId);
  const after = queue[at + 1] || queue[at - 1], next = after ? after.job_id : null;
  try {
    const r = await api("POST", "/api/review", {job_id: jobId, action});
    await refresh();
    const i = visible.findIndex(v => v.type === "review" && v.job_id === next);
    if (i >= 0) { cursor = i; markCursor(); }
    const undo = r.message_id ? {message_id: r.message_id, id: r.created ? r.id : undefined} : {job_id: jobId};
    toast(action === "applied" ? "Marked applied" : action === "bad" ? "Marked a bad match" : "Hidden",
          () => api("POST", "/api/review/undo", undo));
  } catch (e) { toast(`Failed: ${e.message}`); }
}
// Back to the alerts to review: a hidden alert is unhidden, a bad match made here loses its label.
async function restore(r) {
  try {
    await api("POST", "/api/review/undo", r.kind === "hidden" ? {job_id: r.job_id} : {message_id: r.message_id, job_id: r.job_id});
    await refresh(); toast("Restored to the alerts to review");
  } catch (e) { toast(`Not restored: ${e.message}`); }
}
function toast(message, undo) {
  const box = document.getElementById("toast");
  clearTimeout(toastTimer);
  box.replaceChildren(...kids(el("span", {}, message), undo ? el("button", {type: "button", on: {click: async () => {
    box.hidden = true;
    try { await undo(); } catch (e) { toast(`Not undone: ${e.message}`); }
    await refresh(); }}}, "Undo") : null));
  box.hidden = false;
  toastTimer = setTimeout(() => { box.hidden = true; }, 6000);
}

function markCursor() {
  document.querySelectorAll("tr.row.focus").forEach(r => r.classList.remove("focus"));
  if (!visible.length) return;
  cursor = Math.max(0, Math.min(cursor, visible.length - 1));
  const v = visible[cursor];
  const row = document.querySelector(`tr[data-key="${v.type === "app" ? `app:${v.id}` : `review:${CSS.escape(v.job_id)}`}"]`);
  if (row) { row.classList.add("focus"); row.scrollIntoView({block: "nearest"}); }
}
function target() { const v = visible[cursor]; return openId !== null ? openId : v && v.type === "app" ? v.id : null; }
function focusField(id) {
  const t = target();
  if (t === null) return;
  if (openId !== t) openDrawer(t);
  const node = document.getElementById(id);
  if (node) node.focus();
}

async function addApplication() {
  const input = document.getElementById("quick");
  if (!input.value.trim()) { input.focus(); return; }
  try {
    const {id, existing} = await api("POST", "/api/applications", {text: input.value});
    input.value = ""; openDrawer(id, false); await refresh();
    if (existing) toast("Already tracked: opened the existing application");
    const a = findApp(id);
    if (a && !a.title) document.getElementById("field-title").focus();
    else if (a && !a.company) document.getElementById("field-company").focus();
  } catch (err) { toast(err.message); }
}
document.getElementById("quick").addEventListener("keydown", e => { if (e.key === "Enter") addApplication(); });
document.getElementById("add-button").addEventListener("click", addApplication);
document.getElementById("search-open").addEventListener("click", () => {
  const search = document.getElementById("search");
  search.hidden = false; search.focus();
});
document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim(); render(); });
for (const v of ["alerts", "numbers"]) document.getElementById(`view-${v}`).addEventListener("click", () => { view = v; render(); });
document.getElementById("brand").addEventListener("click", () => { view = "apps"; stageFilter = null; render(); });
document.getElementById("help-open").addEventListener("click", () => { document.getElementById("help").hidden = false; });
document.getElementById("help").addEventListener("click", () => { document.getElementById("help").hidden = true; });
window.addEventListener("popstate", () => { if (openId !== null || openAlertId !== null) { openId = null; openAlertId = null; render(); } });

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    const search = document.getElementById("search");
    search.hidden = false; search.focus();
    return;
  }
  if (e.key === "Escape") {
    if (typing) e.target.blur();
    document.getElementById("help").hidden = true;
    if (openId !== null || openAlertId !== null) closeDrawer();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !state) return;
  const v = visible[cursor];
  if (e.key === "j" || e.key === "k") { cursor += e.key === "j" ? 1 : -1; markCursor(); return; }
  if (e.key === "Enter" && v && v.type === "app") { openDrawer(v.id); return; }
  if (e.key === "Enter" && v && v.type === "review") { openAlert(v.job_id); return; }
  if (e.key === "?") { document.getElementById("help").hidden = false; return; }
  if (e.key === "v") { view = VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]; render(); return; }
  if ("abx".includes(e.key) && v && v.type === "review") { review(v.job_id, {a: "applied", b: "bad", x: "hide"}[e.key]); return; }
  if (e.key === "n") { e.preventDefault(); focusField("field-notes"); return; }
  if (e.key === "f") { e.preventDefault(); focusField("follow-up"); return; }
  const t = target();
  if (e.key === "d" && t !== null && findApp(t) && findApp(t).follow_up_at) { act(`/api/applications/${t}/follow-up`, {done: true}, "Follow-up done"); return; }
  if (STAGE_KEYS[e.key] && t !== null) setStage(t, STAGE_KEYS[e.key]);
});

if (TOKEN) refresh();
else showNotice("This page needs the address the jobhunter tracker command printed (it ends in ?t=…). Run `jobhunter tracker` again to get it.");
</script>
</body>
</html>
